<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x1F345;</text></svg>">
  <style>
    :root {
      --bg: #fafafa;
      --bg-focus: #f5f5f5;
      --bg-break: #f0faf5;
      --bg-paused: #fffbeb;
      --text: #0a0a0a;
      --text-secondary: #525252;
      --muted: #a3a3a3;
      --border: #e5e5e5;
      --accent: #0a0a0a;
      --green: #16a34a;
      --green-soft: #dcfce7;
      --amber: #ca8a04;
      --red: #dc2626;
      --ring-size: 280px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "SF Mono", "Fira Code", "Fira Mono", "Roboto Mono", monospace;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      min-height: 100dvh;
      transition: background-color 0.6s ease;
      -webkit-font-smoothing: antialiased;
    }

    body.state-working { background: var(--bg-focus); }
    body.state-break { background: var(--bg-break); }
    body.state-paused { background: var(--bg-paused); }

    .app {
      width: min(400px, 88%);
      margin: 0 auto;
      padding: 3rem 0 4rem;
    }

    /* ---- Screen transitions ---- */
    .screen { display: none; }
    .screen.active {
      display: block;
      animation: screenIn 0.3s ease-out;
    }
    @keyframes screenIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ---- Tomato button ---- */
    .tomato-btn {
      display: block;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 8rem;
      line-height: 1;
      margin: 4rem auto 2rem;
      padding: 0;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.25s ease;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      position: relative;
      will-change: transform;
    }
    .tomato-btn:hover {
      animation: tomato-wiggle 0.6s ease-in-out forwards;
      filter: drop-shadow(0 0 20px rgba(220,38,38,0.6)) brightness(1.1);
    }
    .tomato-btn:active {
      transform: scale(0.88) rotate(-8deg);
      transition: transform 0.1s ease;
      filter: none;
    }
    @keyframes tomato-wiggle {
      0% { transform: scale(1) rotate(0deg); }
      20% { transform: scale(1.18) rotate(-12deg); }
      40% { transform: scale(1.22) rotate(8deg); }
      60% { transform: scale(1.18) rotate(-6deg); }
      80% { transform: scale(1.15) rotate(3deg); }
      100% { transform: scale(1.15) rotate(-2deg); }
    }
    .tomato-btn::after {
      content: '';
      position: absolute;
      inset: -16px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(220,38,38,0.2) 0%, rgba(220,38,38,0.08) 50%, transparent 70%);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      filter: blur(12px);
    }
    .tomato-btn:hover::after {
      opacity: 1;
      animation: glow-breathe 1.5s ease-in-out infinite;
      animation-delay: 0.6s;
    }
    @keyframes glow-breathe {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.2); opacity: 1; }
    }

    .start-hint {
      text-align: center;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--muted);
      margin-bottom: 3rem;
    }

    /* ---- Settings ---- */
    .settings-toggle {
      display: block;
      width: 100%;
      background: none;
      border: none;
      border-top: 1px solid var(--border);
      padding: 0.75rem 0;
      font-family: inherit;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      cursor: pointer;
      transition: color 0.15s;
    }
    .settings-toggle:hover { color: var(--text-secondary); }
    .settings-toggle .chevron {
      display: inline-block;
      transition: transform 0.3s ease;
      font-size: 0.5rem;
      margin-left: 0.3rem;
    }
    .settings-toggle.open .chevron { transform: rotate(180deg); }

    .settings-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease, opacity 0.3s ease;
      opacity: 0;
    }
    .settings-body.open {
      max-height: 300px;
      opacity: 1;
    }
    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      padding: 0.75rem 0 0.5rem;
    }
    .settings-grid label {
      display: block;
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 0.25rem;
    }
    .settings-grid input {
      width: 100%;
      padding: 0.4rem 0.5rem;
      border: 1px solid var(--border);
      border-radius: 0;
      font-family: inherit;
      font-size: 0.8rem;
      color: var(--text);
      background: transparent;
    }
    .settings-grid input:focus {
      outline: none;
      border-color: var(--text);
    }

    /* ---- Timer ---- */
    .timer-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem 0;
    }

    .ring-wrap {
      position: relative;
      width: var(--ring-size);
      height: var(--ring-size);
      margin-bottom: 1.5rem;
    }

    .ring-svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }
    .ring-bg {
      fill: none;
      stroke: var(--border);
      stroke-width: 3;
    }
    .ring-progress {
      fill: none;
      stroke: var(--text);
      stroke-width: 3;
      stroke-linecap: butt;
      transition: stroke-dashoffset 1s linear, stroke 0.6s ease;
    }
    .ring-progress.break { stroke: var(--green); }
    .ring-progress.warning { stroke: var(--amber); }

    .ring-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .timer-digits {
      font-size: 3.2rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      line-height: 1;
      color: var(--text);
    }

    .timer-label {
      font-size: 0.65rem;
      font-weight: 500;
      margin-top: 0.5rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .timer-label.focus-label { color: var(--text-secondary); }
    .timer-label.break-label { color: var(--green); }
    .timer-label.paused-label { color: var(--amber); }

    .paused .timer-digits {
      animation: pulse 2.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    /* ---- Session bar ---- */
    .session-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }
    .session-track {
      width: 100%;
      height: 1px;
      background: var(--border);
      margin-bottom: 2rem;
    }
    .session-fill {
      height: 100%;
      background: var(--text);
      transition: width 1s linear;
    }

    /* ---- Controls ---- */
    .controls { margin-top: 0.5rem; }
    .controls-primary { margin-bottom: 0.5rem; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 0;
      padding: 0.6rem 1rem;
      font-family: inherit;
      font-size: 0.7rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: all 0.1s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      background: transparent;
      color: var(--text);
    }
    .btn:hover { background: var(--text); color: var(--bg); }
    .btn:active { transform: scale(0.97); }

    .btn-primary {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }
    .btn-primary:hover { background: transparent; color: var(--text); }

    .btn-ghost {
      border-color: transparent;
      color: var(--muted);
    }
    .btn-ghost:hover { background: transparent; color: var(--red); border-color: transparent; }

    .btn-full { width: 100%; }
    .btn-row {
      display: flex;
      gap: 0.5rem;
    }
    .btn-row .btn { flex: 1; }

    /* ---- Auto-start ---- */
    .auto-start-bar {
      display: none;
      text-align: center;
      padding: 0.6rem 0;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-secondary);
      border-top: 1px solid var(--border);
      margin-bottom: 1rem;
    }
    .auto-start-bar.visible { display: block; }
    .auto-start-bar a {
      color: var(--text);
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      border-bottom: 1px solid var(--text);
    }
    .auto-start-bar a:hover { opacity: 0.6; }

    /* ---- Complete ---- */
    .complete-screen { text-align: center; }
    .complete-tomato {
      font-size: 4rem;
      line-height: 1;
      margin-bottom: 1.5rem;
      animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes popIn {
      from { transform: scale(0); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .complete-title {
      font-size: 1.2rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.25rem;
    }
    .complete-subtitle {
      font-size: 0.7rem;
      color: var(--text-secondary);
      letter-spacing: 0.05em;
      margin-bottom: 2rem;
    }
    .complete-stats {
      display: flex;
      justify-content: center;
      gap: 2rem;
      padding: 1.25rem 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      margin-bottom: 2rem;
    }
    .stat-cell { text-align: center; }
    .stat-value {
      font-size: 1.4rem;
      font-weight: 700;
      line-height: 1;
    }
    .stat-label {
      font-size: 0.55rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-top: 0.3rem;
    }

    /* ---- Stats / History ---- */
    .stats-section {
      border-top: 1px solid var(--border);
      padding-top: 1.5rem;
      margin-top: 1.5rem;
    }
    .today-detail {
      font-size: 0.7rem;
      color: var(--text-secondary);
      letter-spacing: 0.02em;
    }

    .streak-dots {
      display: flex;
      gap: 0.3rem;
      margin-top: 0.6rem;
      flex-wrap: wrap;
    }
    .streak-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--border);
      transition: background 0.3s;
    }
    .streak-dot.filled { background: var(--text); }

    .empty-state {
      text-align: center;
      padding: 0.25rem 0;
      color: var(--muted);
      font-size: 0.7rem;
      letter-spacing: 0.05em;
    }

    .history-list {
      margin-top: 0.75rem;
      font-size: 0.7rem;
      color: var(--text-secondary);
    }
    .history-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.3rem 0;
      border-bottom: 1px solid var(--border);
      gap: 0.5rem;
    }
    .history-row:last-child { border-bottom: none; }
    .delete-session {
      font-size: 0.65rem;
      color: var(--muted);
      cursor: pointer;
      border: 1px solid transparent;
      background: none;
      padding: 0.25rem 0.4rem;
      font-family: inherit;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      opacity: 0;
      transition: opacity 0.15s, color 0.15s, border-color 0.15s, background 0.15s;
    }
    .history-row:hover .delete-session { opacity: 1; }
    .delete-session:hover { 
      color: var(--red); 
      border-color: var(--red);
      background: rgba(220, 38, 38, 0.05);
    }

    .undo-banner {
      position: fixed;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      background: var(--text);
      color: var(--bg);
      padding: 0.6rem 1rem;
      font-size: 0.7rem;
      letter-spacing: 0.05em;
      border: 1px solid var(--text);
      display: none;
      align-items: center;
      gap: 1rem;
      z-index: 100;
      animation: slideUp 0.2s ease-out;
    }
    .undo-banner.visible { display: flex; }
    @keyframes slideUp {
      from { transform: translateX(-50%) translateY(20px); opacity: 0; }
      to { transform: translateX(-50%) translateY(0); opacity: 1; }
    }
    .undo-btn {
      background: none;
      border: 1px solid var(--bg);
      color: var(--bg);
      padding: 0.3rem 0.6rem;
      font-family: inherit;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: all 0.1s ease;
    }
    .undo-btn:hover {
      background: var(--bg);
      color: var(--text);
    }

    .clear-link {
      font-size: 0.6rem;
      color: var(--muted);
      cursor: pointer;
      border: none;
      background: none;
      text-decoration: underline;
      font-family: inherit;
      margin-top: 0.5rem;
      letter-spacing: 0.05em;
    }
    .clear-link:hover { color: var(--red); }

    /* ---- Responsive ---- */
    @media (max-width: 480px) {
      :root { --ring-size: 220px; }
      .timer-digits { font-size: 2.6rem; }
      .tomato-btn { font-size: 6rem; }
    }
    @media (max-width: 360px) {
      :root { --ring-size: 190px; }
      .timer-digits { font-size: 2.2rem; }
    }
  </style>
</head>
<body>
  <div class="app">

    <!-- ==================== SETUP SCREEN ==================== -->
    <div id="screen-setup" class="screen active">
      <button class="tomato-btn" id="startBtn" aria-label="Start session">🍅</button>
      <div class="start-hint">Click to focus</div>

      <button class="settings-toggle" id="settingsToggle"
        aria-expanded="false" aria-controls="settingsBody">
        Settings <span class="chevron">&#9660;</span>
      </button>
      <div class="settings-body" id="settingsBody" role="region">
        <div class="settings-grid">
          <div>
            <label for="workDuration">Focus (min)</label>
            <input type="number" id="workDuration" min="1" max="90" value="25" step="1">
          </div>
          <div>
            <label for="shortBreak">Break (min)</label>
            <input type="number" id="shortBreak" min="1" max="30" value="5" step="1">
          </div>
          <div>
            <label for="longBreak">Long break (min)</label>
            <input type="number" id="longBreak" min="5" max="45" value="15" step="5">
          </div>
          <div>
            <label for="longBreakEvery">Long break every</label>
            <input type="number" id="longBreakEvery" min="2" max="10" value="4" step="1">
          </div>
        </div>
      </div>

      <div id="statsSection" class="stats-section">
        <div id="todayStats"></div>
        <div id="streakDots" class="streak-dots"></div>
        <div id="historyList" class="history-list"></div>
        <button id="clearHistoryBtn" class="clear-link" style="display:none;">Clear</button>
      </div>
    </div>

    <!-- ==================== TIMER SCREEN ==================== -->
    <div id="screen-timer" class="screen">
      <div class="timer-stage">
        <div id="ringWrap" class="ring-wrap">
          <svg class="ring-svg" viewBox="0 0 200 200">
            <circle class="ring-bg" cx="100" cy="100" r="88"/>
            <circle id="ringProgress" class="ring-progress" cx="100" cy="100" r="88"
              stroke-dasharray="553.00" stroke-dashoffset="553.00"/>
          </svg>
          <div class="ring-center">
            <div id="timerDigits" class="timer-digits">25:00</div>
            <div id="timerLabel" class="timer-label focus-label">Focus</div>
          </div>
        </div>
      </div>

      <div id="autoStartBar" class="auto-start-bar"></div>

      <div class="session-meta">
        <span id="sessionElapsed">0m elapsed</span>
        <span id="sessionRemaining">0 pomodoros</span>
      </div>
      <div class="session-track">
        <div id="sessionBarFill" class="session-fill" style="width:0%"></div>
      </div>

      <div class="controls">
        <div class="controls-primary">
          <button class="btn btn-primary btn-full" id="pauseBtn">Pause</button>
        </div>
        <div class="btn-row">
          <button class="btn" id="skipBtn">Skip</button>
          <button class="btn btn-ghost" id="endBtn">End</button>
        </div>
      </div>
    </div>

    <!-- ==================== COMPLETE SCREEN ==================== -->
    <div id="screen-complete" class="screen">
      <div class="complete-screen">
        <div class="complete-tomato">🍅</div>
        <div class="complete-title" id="completeTitle">Done</div>
        <div class="complete-subtitle" id="completeSubtitle">4 pomodoros</div>
        <div class="complete-stats">
          <div class="stat-cell">
            <div class="stat-value" id="completeFocusTime">0m</div>
            <div class="stat-label">Focus</div>
          </div>
          <div class="stat-cell">
            <div class="stat-value" id="completeBreakTime">0m</div>
            <div class="stat-label">Breaks</div>
          </div>
          <div class="stat-cell">
            <div class="stat-value" id="completeTodayTotal">0</div>
            <div class="stat-label">Today</div>
          </div>
        </div>
        <button class="btn btn-primary btn-full" id="restartBtn">Back to tomato</button>
      </div>
    </div>
  </div>

  <div id="undoBanner" class="undo-banner">
    <span id="undoMessage">Session deleted</span>
    <button class="undo-btn" id="undoBtn">Undo</button>
  </div>

  <script>
    (function () {
      "use strict";

      // ======== Constants ========
      var STORAGE_KEY = "nick_pomodoro_v1";
      var RING_RADIUS = 88;
      var CIRCUMFERENCE = 2 * Math.PI * RING_RADIUS;

      // ======== DOM refs ========
      var $ = function (id) { return document.getElementById(id); };

      var settingsToggle = $("settingsToggle");
      var settingsBody = $("settingsBody");
      var workDurationInput = $("workDuration");
      var shortBreakInput = $("shortBreak");
      var longBreakInput = $("longBreak");
      var longBreakEveryInput = $("longBreakEvery");
      var startBtn = $("startBtn");

      var screenSetup = $("screen-setup");
      var screenTimer = $("screen-timer");
      var screenComplete = $("screen-complete");

      var ringWrap = $("ringWrap");
      var ringProgress = $("ringProgress");
      var timerDigits = $("timerDigits");
      var timerLabel = $("timerLabel");
      var autoStartBar = $("autoStartBar");
      var sessionElapsed = $("sessionElapsed");
      var sessionRemaining = $("sessionRemaining");
      var sessionBarFill = $("sessionBarFill");
      var pauseBtn = $("pauseBtn");
      var skipBtn = $("skipBtn");
      var endBtn = $("endBtn");

      var completeTitle = $("completeTitle");
      var completeSubtitle = $("completeSubtitle");
      var completeFocusTime = $("completeFocusTime");
      var completeBreakTime = $("completeBreakTime");
      var completeTodayTotal = $("completeTodayTotal");
      var restartBtn = $("restartBtn");

      var todayStatsEl = $("todayStats");
      var streakDotsEl = $("streakDots");
      var historyList = $("historyList");
      var clearHistoryBtn = $("clearHistoryBtn");
      var undoBanner = $("undoBanner");
      var undoMessage = $("undoMessage");
      var undoBtn = $("undoBtn");

      // ======== State ========
      var session = null;
      var tickInterval = null;
      var autoStartTimeout = null;
      var autoStartCountdown = 0;
      var originalTitle = document.title;
      var undoData = null;
      var undoTimeout = null;

      // ======== Helpers ========
      function todayKey() {
        var d = new Date();
        return d.getFullYear() + "-" +
          String(d.getMonth() + 1).padStart(2, "0") + "-" +
          String(d.getDate()).padStart(2, "0");
      }

      function formatTime(totalSeconds) {
        var s = Math.max(0, Math.round(totalSeconds));
        var m = Math.floor(s / 60);
        var sec = s % 60;
        return String(m).padStart(2, "0") + ":" + String(sec).padStart(2, "0");
      }

      function formatMins(m) {
        m = Math.round(m);
        if (m < 60) return m + "m";
        var h = Math.floor(m / 60);
        var rem = m % 60;
        return rem > 0 ? h + "h " + rem + "m" : h + "h";
      }

      function clamp(val, lo, hi) {
        return Math.max(lo, Math.min(hi, val));
      }

      // ======== localStorage ========
      function loadData() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return { days: {}, prefs: null };
          var p = JSON.parse(raw);
          if (!p || typeof p !== "object") return { days: {}, prefs: null };
          if (!p.days) p.days = {};
          return p;
        } catch (e) {
          return { days: {}, prefs: null };
        }
      }

      function saveData(data) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      }

      function recordSession(cycles, focusMin, sessionData) {
        var data = loadData();
        var key = todayKey();
        if (!data.days[key]) data.days[key] = { pomodoros: 0, focusMinutes: 0, sessions: [] };
        data.days[key].pomodoros += cycles;
        data.days[key].focusMinutes += focusMin;
        if (!data.days[key].sessions) data.days[key].sessions = [];
        var sessionRecord = {
          timestamp: Date.now(),
          completed: cycles,
          skipped: sessionData.skipped || 0,
          focusMinutes: focusMin,
          intervals: sessionData.intervals || []
        };
        data.days[key].sessions.push(sessionRecord);
        saveData(data);
      }

      function savePrefs() {
        var data = loadData();
        data.prefs = {
          workDuration: parseInt(workDurationInput.value, 10) || 25,
          shortBreak: parseInt(shortBreakInput.value, 10) || 5,
          longBreak: parseInt(longBreakInput.value, 10) || 15,
          longBreakEvery: parseInt(longBreakEveryInput.value, 10) || 4
        };
        saveData(data);
      }

      function loadPrefs() {
        var data = loadData();
        if (data.prefs) {
          workDurationInput.value = data.prefs.workDuration || 25;
          shortBreakInput.value = data.prefs.shortBreak || 5;
          longBreakInput.value = data.prefs.longBreak || 15;
          longBreakEveryInput.value = data.prefs.longBreakEvery || 4;
        }
      }

      // ======== Web Audio chime ========
      var audioCtx = null;

      function getAudioCtx() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        return audioCtx;
      }

      function playChime(type) {
        try {
          var ctx = getAudioCtx();
          var notes, lengths;
          if (type === "warning") {
            notes = [523.25, 523.25];
            lengths = [0.1, 0.1];
          } else if (type === "complete") {
            notes = [523.25, 659.25, 783.99, 1046.5];
            lengths = [0.12, 0.12, 0.12, 0.3];
          } else if (type === "break-end") {
            notes = [440, 523.25, 659.25];
            lengths = [0.1, 0.1, 0.18];
          } else {
            notes = [659.25, 587.33, 523.25];
            lengths = [0.1, 0.1, 0.2];
          }
          var t = ctx.currentTime + 0.05;
          for (var i = 0; i < notes.length; i++) {
            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.type = "sine";
            osc.frequency.value = notes[i];
            gain.gain.setValueAtTime(0.12, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + lengths[i]);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(t);
            osc.stop(t + lengths[i] + 0.01);
            t += lengths[i] + 0.04;
          }
        } catch (e) {}
      }

      // ======== Cycle Calculation ========
      function calculatePlan() {
        var workMin = clamp(parseInt(workDurationInput.value, 10) || 25, 1, 90);
        var shortMin = clamp(parseInt(shortBreakInput.value, 10) || 5, 1, 30);
        var longMin = clamp(parseInt(longBreakInput.value, 10) || 15, 5, 45);
        var longEvery = clamp(parseInt(longBreakEveryInput.value, 10) || 4, 2, 10);
        return {
          workMinPerCycle: workMin,
          shortBreak: shortMin,
          longBreak: longMin,
          longBreakEvery: longEvery
        };
      }

      function getNextInterval(intervalCount, completedCycles, plan) {
        var isWork = intervalCount % 2 === 0;
        if (isWork) {
          return { type: "work", duration: plan.workMinPerCycle };
        } else {
          var isLong = completedCycles > 0 && completedCycles % plan.longBreakEvery === 0;
          return {
            type: isLong ? "long" : "short",
            duration: isLong ? plan.longBreak : plan.shortBreak
          };
        }
      }

      // ======== Screen management ========
      function showScreen(name) {
        screenSetup.classList.remove("active");
        screenTimer.classList.remove("active");
        screenComplete.classList.remove("active");
        document.body.className = "";
        if (name === "setup") screenSetup.classList.add("active");
        else if (name === "timer") screenTimer.classList.add("active");
        else if (name === "complete") screenComplete.classList.add("active");
      }

      // ======== Timer engine ========
      function startSession() {
        savePrefs();
        try { getAudioCtx().resume(); } catch (e) {}
        var plan = calculatePlan();
        var firstInterval = getNextInterval(0, 0, plan);
        session = {
          plan: plan,
          intervals: [firstInterval],
          intervalStatuses: ["active"],
          currentIndex: 0,
          completedCycles: 0,
          skippedCycles: 0,
          totalFocusSeconds: 0,
          totalBreakSeconds: 0,
          sessionStartTime: Date.now(),
          intervalEndTime: 0,
          intervalDuration: 0,
          paused: false,
          pausedRemaining: 0,
          fiveMinWarned: false
        };
        showScreen("timer");
        startInterval(0);
        startTicking();
      }

      function startInterval(index) {
        if (index >= session.intervals.length) {
          var nextInterval = getNextInterval(session.intervals.length, session.completedCycles, session.plan);
          session.intervals.push(nextInterval);
          session.intervalStatuses.push("active");
        }
        session.currentIndex = index;
        session.intervalStatuses[index] = "active";
        session.fiveMinWarned = false;
        var interval = session.intervals[index];
        session.intervalDuration = interval.duration * 60;
        if (session.paused) {
          session.pausedRemaining = session.intervalDuration;
        } else {
          session.intervalEndTime = Date.now() + session.intervalDuration * 1000;
        }
        updateBodyState();
        renderTimerDisplay();
        if (interval.type === "short" || interval.type === "long") {
          playChime("work-end");
        } else if (index > 0) {
          playChime("break-end");
        }
      }

      function updateBodyState() {
        document.body.className = "";
        if (!session) return;
        var timerStage = document.querySelector(".timer-stage");
        if (session.paused) {
          document.body.classList.add("state-paused");
          timerStage.classList.add("paused");
        } else {
          timerStage.classList.remove("paused");
          var interval = session.intervals[session.currentIndex];
          if (interval.type === "work") {
            document.body.classList.add("state-working");
          } else {
            document.body.classList.add("state-break");
          }
        }
      }

      function getRemainingSeconds() {
        if (!session) return 0;
        if (session.paused) return Math.max(0, session.pausedRemaining);
        return Math.max(0, (session.intervalEndTime - Date.now()) / 1000);
      }

      function startTicking() {
        stopTicking();
        tick();
        tickInterval = setInterval(tick, 250);
      }

      function stopTicking() {
        if (tickInterval) {
          clearInterval(tickInterval);
          tickInterval = null;
        }
      }

      function tick() {
        if (!session) return;
        var remaining = getRemainingSeconds();
        var interval = session.intervals[session.currentIndex];
        var elapsed = session.intervalDuration - remaining;

        timerDigits.textContent = formatTime(remaining);

        var progress = session.intervalDuration > 0 ? elapsed / session.intervalDuration : 0;
        var offset = CIRCUMFERENCE * (1 - progress);
        ringProgress.style.strokeDashoffset = Math.max(0, offset);

        ringProgress.classList.remove("break", "warning");
        if (session.paused) {
          // no changes
        } else if (interval.type !== "work") {
          ringProgress.classList.add("break");
        } else if (remaining <= 300 && remaining > 0) {
          ringProgress.classList.add("warning");
        }

        var stateLabel = interval.type === "work" ? "Focus" : "Break";
        document.title = formatTime(remaining) + " \u2014 " + stateLabel + " | Pomodoro";

        if (session.paused) {
          timerLabel.textContent = "Paused";
          timerLabel.className = "timer-label paused-label";
        } else if (interval.type === "work") {
          var workNum = 0;
          for (var i = 0; i <= session.currentIndex; i++) {
            if (session.intervals[i].type === "work") workNum++;
          }
          timerLabel.textContent = "Focus #" + workNum;
          timerLabel.className = "timer-label focus-label";
        } else {
          timerLabel.textContent = interval.type === "long" ? "Long Break" : "Break";
          timerLabel.className = "timer-label break-label";
        }

        var sessElapsed = (Date.now() - session.sessionStartTime) / 1000;
        sessionElapsed.textContent = formatMins(sessElapsed / 60) + " elapsed";
        var pomosStr = session.completedCycles + " pomodoro" + (session.completedCycles === 1 ? "" : "s");
        sessionRemaining.textContent = pomosStr;

        var intervalProgress = session.intervalDuration > 0 ? elapsed / session.intervalDuration : 0;
        sessionBarFill.style.width = (intervalProgress * 100) + "%";

        if (!session.paused && interval.type === "work" && !session.fiveMinWarned &&
            session.intervalDuration > 300 && remaining <= 300 && remaining > 0) {
          session.fiveMinWarned = true;
          playChime("warning");
        }

        if (!session.paused && remaining <= 0 && !autoStartTimeout) {
          if (interval.type === "work") {
            session.totalFocusSeconds += session.intervalDuration;
            session.completedCycles++;
            session.intervalStatuses[session.currentIndex] = "completed";
          } else {
            session.totalBreakSeconds += session.intervalDuration;
            session.intervalStatuses[session.currentIndex] = "completed";
          }
          var nextIdx = session.currentIndex + 1;
          beginAutoStart(nextIdx);
        }
      }

      // ======== Auto-start ========
      function beginAutoStart(nextIndex) {
        stopTicking();
        autoStartCountdown = 5;
        if (nextIndex >= session.intervals.length) {
          var generated = getNextInterval(session.intervals.length, session.completedCycles, session.plan);
          session.intervals.push(generated);
          session.intervalStatuses.push("pending");
        }
        var next = session.intervals[nextIndex];
        var label = next.type === "work" ? "Focus" : (next.type === "long" ? "Long Break" : "Break");
        autoStartBar.classList.add("visible");
        renderAutoStart(label);
        autoStartTimeout = setInterval(function () {
          autoStartCountdown--;
          if (autoStartCountdown <= 0) {
            clearInterval(autoStartTimeout);
            autoStartTimeout = null;
            autoStartBar.classList.remove("visible");
            startInterval(nextIndex);
            startTicking();
          } else {
            renderAutoStart(label);
          }
        }, 1000);
      }

      function renderAutoStart(label) {
        autoStartBar.innerHTML = label + " in <strong>" + autoStartCountdown + "s</strong> &nbsp;\u00b7&nbsp; " +
          "<a onclick='window._pomoNow()'>Now</a> &nbsp;\u00b7&nbsp; " +
          "<a onclick='window._pomoSkipAuto()'>Skip</a>";
      }

      window._pomoNow = function () {
        if (autoStartTimeout) { clearInterval(autoStartTimeout); autoStartTimeout = null; }
        autoStartBar.classList.remove("visible");
        startInterval(session.currentIndex + 1);
        startTicking();
      };

      window._pomoSkipAuto = function () {
        if (autoStartTimeout) { clearInterval(autoStartTimeout); autoStartTimeout = null; }
        autoStartBar.classList.remove("visible");
        var skipIdx = session.currentIndex + 1;
        if (skipIdx >= session.intervals.length) {
          var generated = getNextInterval(session.intervals.length, session.completedCycles, session.plan);
          session.intervals.push(generated);
          session.intervalStatuses.push("pending");
        }
        session.intervalStatuses[skipIdx] = "skipped";
        var skippedInterval = session.intervals[skipIdx];
        if (skippedInterval.type === "work") {
          session.skippedCycles++;
        }
        var nextNext = skipIdx + 1;
        startInterval(nextNext);
        startTicking();
      };

      // ======== Controls ========
      function togglePause() {
        if (!session) return;
        if (session.paused) {
          session.intervalEndTime = Date.now() + session.pausedRemaining * 1000;
          session.paused = false;
          pauseBtn.textContent = "Pause";
        } else {
          session.pausedRemaining = getRemainingSeconds();
          session.paused = true;
          pauseBtn.textContent = "Resume";
        }
        updateBodyState();
      }

      function skipInterval() {
        if (!session) return;
        if (autoStartTimeout) {
          clearInterval(autoStartTimeout);
          autoStartTimeout = null;
          autoStartBar.classList.remove("visible");
        }
        var interval = session.intervals[session.currentIndex];
        var elapsedSec = session.intervalDuration - getRemainingSeconds();
        if (interval.type === "work") {
          session.totalFocusSeconds += elapsedSec;
          if (elapsedSec > session.intervalDuration * 0.5) {
            session.completedCycles++;
            session.intervalStatuses[session.currentIndex] = "completed";
          } else {
            session.skippedCycles++;
            session.intervalStatuses[session.currentIndex] = "skipped";
          }
        } else {
          session.totalBreakSeconds += elapsedSec;
          session.intervalStatuses[session.currentIndex] = "skipped";
        }
        var nextIdx = session.currentIndex + 1;
        session.paused = false;
        pauseBtn.textContent = "Pause";
        startInterval(nextIdx);
      }

      function endSession() {
        if (!session) return;
        var interval = session.intervals[session.currentIndex];
        var elapsedSec = session.intervalDuration - getRemainingSeconds();
        if (interval.type === "work") {
          session.totalFocusSeconds += elapsedSec;
          if (elapsedSec > session.intervalDuration * 0.5) {
            session.completedCycles++;
            session.intervalStatuses[session.currentIndex] = "completed";
          } else {
            session.intervalStatuses[session.currentIndex] = "partial";
          }
        } else {
          session.totalBreakSeconds += elapsedSec;
          session.intervalStatuses[session.currentIndex] = "partial";
        }
        finishSession();
      }

      function finishSession() {
        stopTicking();
        if (autoStartTimeout) { clearInterval(autoStartTimeout); autoStartTimeout = null; }
        autoStartBar.classList.remove("visible");
        var focusMin = Math.round(session.totalFocusSeconds / 60);
        var breakMin = Math.round(session.totalBreakSeconds / 60);
        var cycles = session.completedCycles;
        var skipped = session.skippedCycles || 0;
        var intervalData = [];
        for (var i = 0; i < session.intervals.length; i++) {
          var interval = session.intervals[i];
          var status = session.intervalStatuses[i] || "active";
          if (status === "completed" || status === "skipped" || status === "partial") {
            intervalData.push({
              type: interval.type,
              duration: interval.duration,
              status: status
            });
          }
        }
        recordSession(cycles, focusMin, {
          skipped: skipped,
          intervals: intervalData
        });

        completeTitle.textContent = "Done";
        var subtitle = cycles + " pomodoro" + (cycles === 1 ? "" : "s");
        if (skipped > 0) {
          subtitle += " · " + skipped + " skipped";
        }
        completeSubtitle.textContent = subtitle;
        completeFocusTime.textContent = formatMins(focusMin);
        completeBreakTime.textContent = formatMins(breakMin);
        var data = loadData();
        var today = data.days[todayKey()];
        completeTodayTotal.textContent = today ? today.pomodoros : cycles;
        document.title = "Done! | Pomodoro";
        playChime("complete");
        session = null;
        showScreen("complete");
      }

      // ======== Render helpers ========
      function renderTimerDisplay() {
        if (!session) return;
        timerDigits.textContent = formatTime(getRemainingSeconds());
        ringProgress.style.strokeDashoffset = String(CIRCUMFERENCE);
        ringProgress.classList.remove("break", "warning");
        if (session.intervals[session.currentIndex].type !== "work") {
          ringProgress.classList.add("break");
        }
      }

      function renderIntervalIcon(interval) {
        if (interval.type === "work") {
          if (interval.status === "completed") return '<span style="color: var(--green);">●</span>';
          if (interval.status === "skipped") return '<span style="color: var(--muted);">○</span>';
          if (interval.status === "partial") return '<span style="color: var(--amber);">◐</span>';
        }
        return "";
      }

      function deleteSession(sessionIndex) {
        var data = loadData();
        var key = todayKey();
        if (!data.days[key] || !data.days[key].sessions) return;
        
        var session = data.days[key].sessions[sessionIndex];
        if (!session) return;
        
        // Store undo data
        undoData = {
          key: key,
          index: sessionIndex,
          session: JSON.parse(JSON.stringify(session))
        };
        
        // Subtract the session's pomodoros and focus time from the day totals
        data.days[key].pomodoros -= session.completed || 0;
        data.days[key].focusMinutes -= session.focusMinutes || 0;
        
        // Remove the session
        data.days[key].sessions.splice(sessionIndex, 1);
        
        // If no sessions left, clean up the day entry
        if (data.days[key].sessions.length === 0) {
          delete data.days[key];
        }
        
        saveData(data);
        renderTodayStats();
        showUndoBanner();
      }

      function showUndoBanner() {
        if (undoTimeout) clearTimeout(undoTimeout);
        undoBanner.classList.add('visible');
        undoTimeout = setTimeout(function() {
          hideUndoBanner();
        }, 5000);
      }

      function hideUndoBanner() {
        undoBanner.classList.remove('visible');
        undoData = null;
        if (undoTimeout) {
          clearTimeout(undoTimeout);
          undoTimeout = null;
        }
      }

      function undoDelete() {
        if (!undoData) return;
        
        var data = loadData();
        var key = undoData.key;
        
        // Restore the day entry if it was deleted
        if (!data.days[key]) {
          data.days[key] = { pomodoros: 0, focusMinutes: 0, sessions: [] };
        }
        
        // Add back the session at the original index
        data.days[key].sessions.splice(undoData.index, 0, undoData.session);
        
        // Add back the totals
        data.days[key].pomodoros += undoData.session.completed || 0;
        data.days[key].focusMinutes += undoData.session.focusMinutes || 0;
        
        saveData(data);
        renderTodayStats();
        hideUndoBanner();
      }

      function renderTodayStats() {
        var data = loadData();
        var today = data.days[todayKey()];
        var pomos = today ? today.pomodoros : 0;
        var focus = today ? today.focusMinutes : 0;
        var hasSessions = today && today.sessions && today.sessions.length > 0;

        if (!hasSessions) {
          todayStatsEl.innerHTML = '<div class="empty-state">No sessions today</div>';
          streakDotsEl.innerHTML = "";
          historyList.innerHTML = "";
          clearHistoryBtn.style.display = "none";
        } else {
          if (pomos > 0) {
            todayStatsEl.innerHTML =
              '<div class="today-detail">' +
                pomos + ' pomodoro' + (pomos === 1 ? '' : 's') + ' · ' +
                formatMins(focus) + ' focus' +
              '</div>';
            var maxDots = Math.max(pomos, 8);
            var dots = "";
            for (var i = 0; i < maxDots; i++) {
              dots += '<span class="streak-dot' + (i < pomos ? ' filled' : '') + '"></span>';
            }
            streakDotsEl.innerHTML = dots;
          } else {
            todayStatsEl.innerHTML =
              '<div class="today-detail">' + formatMins(focus) + ' focus</div>';
            streakDotsEl.innerHTML = "";
          }

          if (today.sessions && today.sessions.length > 0) {
            var sessionRows = today.sessions.slice().reverse().map(function (sess, idx) {
              var time = new Date(sess.timestamp);
              var timeStr = String(time.getHours()).padStart(2, '0') + ':' + String(time.getMinutes()).padStart(2, '0');
              var icons = "";
              if (sess.intervals && sess.intervals.length > 0) {
                var workIntervals = sess.intervals.filter(function(i) { return i.type === "work"; });
                icons = workIntervals.map(renderIntervalIcon).join(" ");
                if (!icons) icons = '<span style="color: var(--muted);">\u2014</span>';
              } else {
                icons = '<span style="color: var(--muted);">\u2014</span>';
              }
              var statusText = "";
              if (sess.completed > 0) {
                statusText = sess.completed + " done";
                if (sess.skipped > 0) statusText += ", " + sess.skipped + " skipped";
              } else if (sess.skipped > 0) {
                statusText = sess.skipped + " skipped";
              } else {
                statusText = "partial";
              }
              var originalIdx = today.sessions.length - 1 - idx;
              return '<div class="history-row">' +
                '<div style="display: flex; align-items: center; gap: 0.5rem;">' +
                  '<span style="color: var(--muted);">' + timeStr + '</span>' +
                  '<span>' + icons + '</span>' +
                '</div>' +
                '<div style="display: flex; align-items: center; gap: 0.5rem;">' +
                  '<span style="text-align: right;">' +
                    formatMins(sess.focusMinutes) + ' <span style="color: var(--muted);">' + statusText + '</span>' +
                  '</span>' +
                  '<button class="delete-session" data-session-idx="' + originalIdx + '" aria-label="Delete session">del</button>' +
                '</div>' +
              '</div>';
            }).join("");
            historyList.innerHTML = sessionRows;
            
            // Add delete listeners
            var deleteBtns = historyList.querySelectorAll('.delete-session');
            for (var i = 0; i < deleteBtns.length; i++) {
              deleteBtns[i].addEventListener('click', function(e) {
                var idx = parseInt(e.target.getAttribute('data-session-idx'), 10);
                deleteSession(idx);
              });
            }
          } else {
            historyList.innerHTML = "";
          }
          clearHistoryBtn.style.display = "inline";
        }
      }

      // ======== Event listeners ========
      settingsToggle.addEventListener("click", function () {
        var open = settingsBody.classList.toggle("open");
        settingsToggle.classList.toggle("open");
        settingsToggle.setAttribute("aria-expanded", open ? "true" : "false");
      });

      startBtn.addEventListener("click", startSession);
      pauseBtn.addEventListener("click", togglePause);
      skipBtn.addEventListener("click", skipInterval);
      endBtn.addEventListener("click", endSession);

      restartBtn.addEventListener("click", function () {
        document.title = originalTitle;
        showScreen("setup");
        renderTodayStats();
      });

      clearHistoryBtn.addEventListener("click", function () {
        var data = loadData();
        data.days = {};
        saveData(data);
        renderTodayStats();
      });

      undoBtn.addEventListener("click", undoDelete);

      document.addEventListener("keydown", function (e) {
        if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT" || e.target.tagName === "TEXTAREA") return;
        if (e.code === "Space" && session) { e.preventDefault(); togglePause(); }
        else if ((e.key === "s" || e.key === "S") && session) { e.preventDefault(); skipInterval(); }
        else if (e.key === "Escape" && session) { e.preventDefault(); endSession(); }
      });

      // ======== Init ========
      loadPrefs();
      renderTodayStats();

    })();
  </script>
</body>
</html>
